     <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laboratory | My Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #d3b5f8 0%, #A47AA3 50%, #5C425C 100%);
    color: #ffffff;
    overflow-x: hidden;
  }

  /* Navbar */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 4rem;
    background: rgba(86, 61, 119, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    color: #ffffff;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 400;
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: #e1bee7;
  }

  .nav-links a.active::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #e1bee7;
    border-radius: 2px;
  }

  /* Header */
  .lab-header {
    text-align: center;
    padding: 3rem 2rem 1rem;
  }

  .lab-header h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }

  .lab-header p {
    color: rgba(255,255,255,0.85);
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* Lab Grid */
  .lab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 2rem;
    max-width: 1100px;
    margin: 2rem auto 4rem;
    padding: 0 2rem;
  }

  /* Lab Card */
  .lab-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .lab-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
  }

  /* PDF Preview Area */
  .lab-preview {
    width: 100%;
    height: 280px;
    background: rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .lab-preview iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .lab-preview .pdf-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    color: rgba(255,255,255,0.5);
  }

  .lab-preview .pdf-icon svg {
    width: 56px;
    height: 56px;
    stroke: rgba(255,255,255,0.4);
    fill: none;
    stroke-width: 1.5;
  }

  .lab-preview .pdf-icon span {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Card Body */
  .lab-body {
    padding: 1.5rem;
  }

  .lab-number {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #e1bee7;
    margin-bottom: 0.5rem;
  }

  .lab-body h3 {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  .lab-body p {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
    line-height: 1.6;
    margin-bottom: 1.25rem;
  }

  .lab-actions {
    display: flex;
    gap: 0.75rem;
  }

  .btn-view,
  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 1.3rem;
    border-radius: 50px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .btn-view {
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .btn-view:hover {
    background: rgba(255,255,255,0.25);
  }

  .btn-download {
    background: #ffffff;
    color: #5C425C;
  }

  .btn-download:hover {
    background: #f3e5f5;
    transform: translateY(-2px);
  }

  .btn-view svg,
  .btn-download svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  /* Responsive */
  @media (max-width: 768px) {
    nav {
      padding: 1rem 1.5rem;
      flex-direction: column;
      gap: 1rem;
    }

    .nav-links {
      gap: 1.5rem;
    }

    .lab-header h1 {
      font-size: 1.8rem;
    }

    .lab-grid {
      grid-template-columns: 1fr;
      padding: 0 1rem;
    }
  }
</style>
</head>
