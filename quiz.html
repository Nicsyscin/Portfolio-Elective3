<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz | My Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(
      135deg,
      #d3b5f8 0%,
      #A47AA3 50%,
      #5C425C 100%
    );
    color: #ffffff;
    overflow-x: hidden;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 4rem;
    background: rgba(86, 61, 119, 0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

   /* Navbar */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 4rem;
    background: rgba(86, 61, 119, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    color: #ffffff;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 400;
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: #e1bee7;
  }

  .nav-links a.active::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #e1bee7;
    border-radius: 2px;
  }
  main {
    min-height: calc(100vh - 80px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4rem 2rem;
  }

  .landing {
    width: 800px;
    max-width: 100%;
    padding: 4rem;
    text-align: center;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }

  .landing h1 {
    font-size: 3rem;
    margin-bottom: 1rem;
  }

  .landing p {
    font-size: 1.05rem;
    line-height: 1.7;
    color: rgba(255,255,255,0.85);
    margin-bottom: 2rem;
  }

  .btn {
    display: inline-block;
    background: #ffffff;
    color: #5C425C;
    padding: 0.9rem 2.5rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn:hover {
    transform: translateY(-3px);
    background: #f3e5f5;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }

  @media (max-width: 700px) {
    nav {
      padding: 1.5rem 2rem;
    }

    .nav-links {
      gap: 1rem;
    }

    .landing {
      padding: 3rem 2rem;
    }

    .landing h1 {
      font-size: 2.3rem;
    }
  }
</style>
</head>

<body>

<nav>
  <div class="logo">MY PORTFOLIO</div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="quiz.html" class="active">Quiz</a></li>
    <li><a href="laboratory.html">Laboratory</a></li>
    <li><a href="exam.html">Exam</a></li>
  </ul>
</nav>

<main>
  <section class="landing">

    <h1>My Quiz Works</h1>

    <p>
      Here you can find all of my
      quiz activities, outputs, and assessments throughout the semester.
    </p>
    <img src="quiz1.png" alt="Quiz 1 Screenshot">

  </section>
</main>

</body>
</html>
