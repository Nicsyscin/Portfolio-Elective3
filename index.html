<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #d3b5f8 0%, #A47AA3 50%, #5C425C 100%);
    color: #ffffff;
    overflow-x: hidden;
  }

  /* Navbar */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 4rem;
    background: rgba(86, 61, 119, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    color: #ffffff;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 400;
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: #e1bee7;
  }

  .nav-links a.active::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #e1bee7;
    border-radius: 2px;
  }

  /* Main Content */
  main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 6rem;
    gap: 4rem;
    min-height: calc(100vh - 80px);
  }

  /* Left Image Placeholder */
  .image-placeholder {
    width: 350px;
    aspect-ratio: 3/4;
    background-color: #e0e0e0;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    background-image: url('nicsy.jpg'); background-size: cover; background-position: center;
  }

  /* Right Text Content */
  .content {
    flex: 1;
    max-width: 500px;
  }

  .content h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    line-height: 1.1;
  }

  .content p {
    font-size: 1.05rem;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 2.5rem;
  }

  .content button {
    background: #ffffff;
    color: #5C425C;
    border: none;
    padding: 0.9rem 2.5rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
  }

  .content button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    background: #f3e5f5;
  }
  

  /* Responsive */
  @media (max-width: 900px) {
    nav {
      padding: 1.5rem 2rem;
    }
    .nav-links {
      gap: 1.5rem;
    }
    main {
      flex-direction: column;
      padding: 3rem 2rem;
      text-align: center;
    }
    .content h1 {
      font-size: 2.5rem;
    }
  }
</style>
</head>
<body>

  <!-- Navbar -->
  <nav>
  <div class="logo">MY PORTFOLIO</div>
  <ul class="nav-links">
  <li><a href="home.html" class="active">Home</a></li>
  <li><a href="quiz.html">Quiz</a></li>
  <li><a href="laboratory.html">Laboratory</a></li>
  <li><a href="exam.html">Exam</a></li>
  </ul>
</nav>

  <!-- Main Content -->
  <main>
    <!-- Image -->
    <div class="image-placeholder"></div>
    
    <!-- Name and About + Button -->
    <div class="content">
      <h1>Hi, I'm Princess Nicole Saulog!</h1>
      <p>I am currently a 3rd year BSIT student in PCU - Dasma. Hope that this would end well :D</p>
      <button onclick="window.location.href='quiz.html'">Explore Works →</button>
    </div>
  </main>

</body>
</html>
