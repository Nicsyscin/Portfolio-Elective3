<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #d3b5f8 0%, #A47AA3 50%, #5C425C 100%);
    color: #ffffff;
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient background shapes */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
  }
  .blob-a {
    width: 420px;
    height: 420px;
    top: -120px;
    right: -100px;
    background: rgba(255, 255, 255, 0.18);
  }
  .blob-b {
    width: 320px;
    height: 320px;
    bottom: -140px;
    left: -80px;
    background: rgba(92, 66, 92, 0.35);
  }

    /* Navbar */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 4rem;
    background: rgba(86, 61, 119, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    color: #ffffff;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 400;
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: #e1bee7;
  }

  .nav-links a.active::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #e1bee7;
    border-radius: 2px;
  }
  /* Main Content */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 6rem;
    gap: 5rem;
    min-height: calc(100vh - 81px);
  }

  /* Left Image */
  .portrait-wrap {
    position: relative;
    flex-shrink: 0;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.7s ease forwards;
  }
  .portrait-wrap::before {
    content: '';
    position: absolute;
    top: -22px;
    left: -22px;
    width: 100%;
    height: 100%;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 20px;
    z-index: -1;
  }
  .image-placeholder {
    width: 330px;
    aspect-ratio: 3/4;
    background-color: #e0e0e0;
    border-radius: 18px;
    box-shadow: 0 25px 55px rgba(37, 22, 46, 0.45);
    background-image: url('nicsy.png');
    background-size: cover;
    background-position: center;
  }

  /* Right Text Content */
  .content {
    flex: 1;
    max-width: 540px;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.7s ease 0.15s forwards;
  }
  .content h1 {
    font-family: 'Fraunces', serif;
    font-size: 3.2rem;
    font-weight: 600;
    margin-bottom: 1.25rem;
    line-height: 1.08;
  }
  .content p {
    font-size: 1.05rem;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 1.75rem;
    max-width: 46ch;
  }

  .cta-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.25rem;
  }
  .content button {
    background: #ffffff;
    color: #5C425C;
    border: none;
    padding: 0.9rem 2.3rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
  }
  .content button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    background: #f3e5f5;
  }

  .socials {
    display: flex;
    gap: 0.75rem;
  }
  .socials a {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
    text-decoration: none;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .socials a:hover {
    background: rgba(255, 255, 255, 0.22);
    transform: translateY(-2px);
  }
  .socials svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  @keyframes rise {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .portrait-wrap, .content {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }

  /* Responsive */
  @media (max-width: 900px) {
    nav {
      padding: 1.25rem 1.75rem;
    }
    .nav-links {
      gap: 1.25rem;
    }
    main {
      flex-direction: column;
      padding: 3rem 2rem;
      text-align: center;
      gap: 3rem;
    }
    .portrait-wrap::before {
      top: -14px;
      left: -14px;
    }
    .image-placeholder {
      width: 260px;
    }
    .content h1 {
      font-size: 2.4rem;
    }
    .content p {
      max-width: none;
    }
    .cta-row {
      align-items: center;
    }
  }
</style>
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <!-- Navbar -->
  <nav>
    <div class="logo">MY PORTFOLIO</div>
    <ul class="nav-links">
      <li><a href="home.html" class="active">Home</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="laboratory.html">Laboratory</a></li>
      <li><a href="exam.html">Exam</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main>
    <!-- Image -->
    <div class="portrait-wrap">
      <div class="image-placeholder"></div>
    </div>

    <!-- Name and About + Button -->
    <div class="content">
      <h1>Hi, I'm Princess Nicole B. Saulog!</h1>
      <p>I'm a 3rd year BSIT student at PCU Dasma, learning to build things one project at a time. This site is where I'm putting that together. Hope it turns out well :)</p>

      <div class="cta-row">
        <button onclick="window.location.href='quiz.html'">Explore Works →</button>
        <div class="socials">
          <a href="https://nicsyscin.github.io/Portfolio-Elective3/" aria-label="GitHub">

          <a href="mailto:pnbsaulog@pcu.edu.ph" aria-label="Gmail">
            <svg viewBox="0 0 24 24"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h17A1.5 1.5 0 0 1 22 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18.5v-13Zm2 .6v.32l8 6.03 8-6.03V6.1l-8 6-8-6Z"/></svg>
          </a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
